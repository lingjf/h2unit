name: ci

on:
  push:
    branches:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  CMAKE_COLOR_DIAGNOSTICS: ON

jobs:
  linux-example:
    name: linux-example-${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - uses: actions/checkout@v5

      - name: show tool versions
        run: |
          gcc --version
          g++ --version
          cmake --version

      - name: configure example
        run: cmake -S example -B ci_example -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: build example
        run: cmake --build ci_example

      - name: run example smoke tests
        run: ./ci_example/a.out -C -p -m -v 1 -x -i 'suite=rectangle compares'

  linux-gcc:
    name: linux-gcc-c++${{ matrix.cpp }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cpp: ['11', '14', '17', '20', '23']
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v5

      - name: configure test
        run: >-
          cmake -S test -B ci_test
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_STANDARD=${{ matrix.cpp }}
          -DCMAKE_CXX_FLAGS=-Wno-unused-result

      - name: build test
        run: cmake --build ci_test

      # Exception, dynamic-library, socket, and stdio suites are platform
      # integrations. Keep CI deterministic while covering the portable core.
      - name: run portable test suites
        run: |
          ./ci_test/a.out \
            -C -s name -p -m -v 1 -x \
            -e tags=memory_check suite=throw suite=lib_dynamic suite=SOCK suite=stdio \
            -o ci_test/test-results.xml

      - name: upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gcc-c++${{ matrix.cpp }}-test-results
          path: ci_test/test-results.xml
          if-no-files-found: ignore

  linux-clang:
    name: linux-clang-c++14
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v5

      - name: show tool versions
        run: |
          clang --version
          clang++ --version
          cmake --version

      - name: configure test
        run: cmake -S test -B ci_test -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=14

      - name: build test
        run: cmake --build ci_test

      - name: run portable test suites
        run: |
          ./ci_test/a.out \
            -C -s name -p -m -v 1 -x \
            -e tags=memory_check suite=throw suite=lib_dynamic suite=SOCK suite=stdio \
            -o ci_test/test-results.xml

      - name: upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-clang-c++14-test-results
          path: ci_test/test-results.xml
          if-no-files-found: ignore

  macos:
    name: macos-${{ matrix.arch }}-clang
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: arm64, runner: macos-15}
          - {arch: intel, runner: macos-15-intel}
    steps:
      - uses: actions/checkout@v5

      - name: show tool versions
        run: |
          uname -a
          clang --version
          cmake --version
          xcodebuild -version

      - name: configure example
        run: cmake -S example -B ci_example -DCMAKE_BUILD_TYPE=Debug

      - name: build example
        run: cmake --build ci_example

      - name: run example smoke tests
        run: ./ci_example/a.out -C -p -m -v 1 -x -i 'suite=rectangle compares'

      - name: configure test
        run: cmake -S test -B ci_test -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=14

      - name: build test
        run: cmake --build ci_test

      - name: run portable test suites
        run: |
          ./ci_test/a.out \
            -C -s name -p -m -v 1 -x \
            -e tags=memory_check suite=throw suite=lib_dynamic suite=SOCK suite=stdio \
            -o ci_test/test-results.xml

      - name: upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-test-results
          path: ci_test/test-results.xml
          if-no-files-found: ignore

  windows-msvc:
    name: windows-${{ matrix.arch }}-msvc
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86, platform: Win32}
          - {arch: x64, platform: x64}
    steps:
      - uses: actions/checkout@v5

      - uses: microsoft/setup-msbuild@v2

      - name: show tool versions
        run: |
          python --version
          cmake --version
          msbuild -version -nologo

      - name: generate and build example
        run: |
          cd example
          python ../build/vcxproj.py
          msbuild example.vcxproj /m /property:Configuration=Debug /property:Platform=${{ matrix.platform }}

      - name: run example
        run: ./example/example.exe

      - name: build dynamic library
        working-directory: test/libs
        run: |
          cmake -A ${{ matrix.platform }} .
          cmake --build . --config Debug --parallel

      - name: generate and build test
        run: |
          cd test
          python ../build/vcxproj.py
          msbuild test.vcxproj /m:1 /property:Configuration=Debug /property:Platform=${{ matrix.platform }}

      - name: run tests
        working-directory: test
        run: ./test.exe -C -s name -p -v 1 -x -o test-results.xml

      - name: upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-test-results
          path: test/test-results.xml
          if-no-files-found: ignore

  bazel:
    name: bazel
    runs-on: ubuntu-24.04
    env:
      USE_BAZEL_VERSION: 7.4.1
    steps:
      - uses: actions/checkout@v5

      # Bazel 9 removed the native C++ rules used by BUILD.bazel.
      - uses: bazelbuild/setup-bazelisk@v3

      - name: verify Bazel version
        run: test "$(bazel --version)" = "bazel 7.4.1"

      - name: build all targets
        run: bazel build --noenable_bzlmod --incompatible_disallow_empty_glob=false :all

      - name: run starter
        run: ./bazel-bin/starter

      - name: run single-header example
        run: ./bazel-bin/example1

      - name: run split-header example
        run: ./bazel-bin/example2

      - name: run conformance example
        run: ./bazel-bin/template_function_argument_deduction
